<!-- Chatbot Widget — bottom-right -->
<div class="chatbot-widget" x-data="chatbot()" x-init="init()" x-cloak>
    <!-- Chat Window -->
    <div x-show="isOpen" x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-4"
         class="chatbot-window" style="display: none;">

        <!-- Header -->
        <div class="chatbot-header">
            <div class="flex items-center gap-3">
                <div class="chatbot-avatar">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </div>
                <div>
                    <div class="text-white font-medium text-sm flex items-center gap-2">
                        Mahashank Assistant
                        <span class="bg-rw-gold/30 text-rw-gold-light text-[9px] px-1.5 py-0.5 rounded-full font-semibold uppercase tracking-wide">AI</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="chatbot-status-dot"></span>
                        <span class="text-white/70 text-xs">AI-Powered · Replies instantly</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <!-- Minimize / Dropdown button -->
                <button @click="isMinimized = !isMinimized" class="chatbot-header-btn" title="Minimize">
                    <svg x-show="!isMinimized" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
                    <svg x-show="isMinimized" style="display:none" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
                <!-- Close button -->
                <button @click="isOpen = false; isMinimized = false" class="chatbot-header-btn" title="Close">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div class="chatbot-messages" x-ref="messages" x-show="!isMinimized" x-collapse>
            <template x-for="(msg, idx) in messages" :key="idx">
                <div :class="msg.from === 'bot' ? 'chatbot-msg-bot' : 'chatbot-msg-user'">
                    <div :class="msg.from === 'bot' ? 'chatbot-bubble-bot' : 'chatbot-bubble-user'"
                         x-html="msg.from === 'bot' ? renderMarkdown(msg.text) : escapeHtml(msg.text)"></div>
                </div>
            </template>

            <!-- Typing indicator -->
            <div x-show="isTyping" class="chatbot-msg-bot" style="display: none;">
                <div class="chatbot-bubble-bot">
                    <div class="flex gap-1">
                        <span class="chatbot-typing-dot"></span>
                        <span class="chatbot-typing-dot" style="animation-delay: 0.15s;"></span>
                        <span class="chatbot-typing-dot" style="animation-delay: 0.3s;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick replies -->
        <div x-show="!isMinimized && messages.length <= 2" class="chatbot-quick-replies">
            <button @click="sendQuickReply('products')" class="chatbot-quick-btn">Wallpapers & Murals</button>
            <button @click="sendQuickReply('pricing')" class="chatbot-quick-btn">Pricing</button>
            <button @click="sendQuickReply('shipping')" class="chatbot-quick-btn">Shipping</button>
            <button @click="sendQuickReply('installation')" class="chatbot-quick-btn">Installation</button>
        </div>

        <!-- Input -->
        <form x-show="!isMinimized" @submit.prevent="sendMessage()" class="chatbot-input-area">
            <input type="text" x-model="inputText" placeholder="Type your message..."
                   class="chatbot-input">
            <button type="submit" class="chatbot-send-btn" :disabled="!inputText.trim()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </form>
    </div>

    <!-- Floating Button -->
    <button @click="isOpen = !isOpen" class="chatbot-fab" :class="{ 'chatbot-fab-active': isOpen }">
        <svg x-show="!isOpen" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <svg x-show="isOpen" style="display: none;" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <span x-show="!isOpen && unreadCount > 0" class="chatbot-badge" x-text="unreadCount" style="display: none;"></span>
    </button>
</div>
